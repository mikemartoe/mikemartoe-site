name: Sandtree activity refresh
# Daily Redfin + Homes.com views/saves for 901 Sandtree (12:00 UTC = 8 AM EDT / 7 AM EST).
# Zillow blocks bots, so its last number is kept. Commits assets/sandtree/activity.json only when a count changes.
# Oct 29 2026 test: GitHub's runner IPs get Redfin's "confirm you are human" page and Homes.com "Access Denied" (curl, headless
# Chromium and the r.jina.ai reader), so the job currently keeps the last good values and commits nothing. It starts working
# by itself if a source lets the runner through, or run it on a self-hosted runner (home IP) via workflow_dispatch.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-data-commit
  cancel-in-progress: false
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium > /dev/null
      - name: Fetch counts (fail-safe; keeps last good values on any error)
        run: python tools/update_sandtree.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/sandtree/activity.json; then echo "No change"; exit 0; fi
          git config user.name "mikemartoe-site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sandtree/activity.json
          git commit -m "Sandtree activity refresh $(TZ=America/New_York date '+%b %-d %-I:%M %p') ET (GitHub Actions)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
