name: Rate ticker refresh
# Weekdays after Mortgage News Daily posts the day's rates (21:30 UTC = 5:30 PM EDT / 4:30 PM EST,
# with a second pass two hours later). Commits assets/rates.json only when values change.
on:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-data-commit
  cancel-in-progress: false
jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates (fail-safe; keeps last good values on any error)
        run: python3 tools/update_rates.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/rates.json; then echo "No change"; exit 0; fi
          git config user.name "mikemartoe-site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rates.json
          git commit -m "Update mortgage rates $(TZ=America/New_York date +%F) (GitHub Actions)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
